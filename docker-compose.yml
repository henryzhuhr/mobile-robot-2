# https://docs.docker.com/reference/compose-file/services/
services:
  mobile-robot:
    container_name: mobile-robot
    image: mobile-robot:1.0.0

    ## recommended to use `scripts/docker-pre-build.sh` to build the image
    # build: 
    #   context: .
    #   dockerfile: dockerfiles/Dockerfile
    #   args:
    #     - UV_VERSION=0.8.19
    #     - MIRRORS_URL=mirrors.cloud.tencent.com
    #     - CLEAN_APT_CACHE=0  # 设置为1可以减小镜像体积，但会增加构建时间

    restart: unless-stopped
    environment:  # 设置环境变量
      # DISPLAY: $DISPLAY
      # -- IP 是宿主机的ip地址，用于显示图形界面
      # 1. 执行命令获取宿主机ip地址后，替换下面的IP 
      #    export IP=$(ifconfig en0 | grep inet | awk '$1=="inet" {print $2}') && echo $IP
      # 2. 然后在终端执行 `xhost +` 启动X11客户端
      DISPLAY: host.docker.internal:0 # 宿主机 运行 : https://techsparx.com/software-development/docker/display-x11-apps.html
      # NVIDIA_VISIBLE_DEVICES: all
      # NVIDIA_DRIVER_CAPABILITIES: all
    volumes:
      - ~/.ssh:/root/.ssh:ro # 挂载宿主机的ssh配置文件，方便推拉代码（只读）
      - .:/root/mobile-robot
      # - /tmp/.X11-unix:/tmp/.X11-unix:rw # 显示图形界面，需要 `xhost +` 启动X11客户端
    tty: true
    stdin_open: true
    working_dir: /root/mobile-robot
    network_mode: "host"  # 使用主机网络模式
    # platform: linux/arm64/v8
  
    # runtime: nvidia  # 使用 nvidia-docker
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - capabilities: [gpu]
    
    # sleep infinity 用于保持容器运行，否则 vscode 无法进入容器
    command: ["sleep", 'infinity']